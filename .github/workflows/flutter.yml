name: Flutter CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          cache: true
      - run: flutter pub get
      - name: Analyze Flutter code
        run: |
          set +e
          flutter analyze 2>&1 | tee "$RUNNER_TEMP/flutter-analyze.log"
          status=${PIPESTATUS[0]}
          if [[ $status != 0 ]]; then
            while IFS= read -r line; do
              line=${line//%/%25}
              echo "::error::$line"
            done < <(grep ' • ' "$RUNNER_TEMP/flutter-analyze.log" | head -30)
          fi
          exit "$status"
      - run: flutter test
  web-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          cache: true
      - run: flutter build web
      - uses: actions/upload-artifact@v4
        with:
          name: DetechX-Website
          path: build/web
          if-no-files-found: error
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          cache: true
      - name: Generate Android runner
        run: |
          flutter create --no-pub --platforms=android --org com.detechx --project-name detechx "$RUNNER_TEMP/detechx"
          cp -R "$RUNNER_TEMP/detechx/android" android
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="detechx"/android:label="DetechX"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "27.0.12077973"/' android/app/build.gradle.kts
          # Current Android plugins use Kotlin 2.2 bytecode.
          sed -Ei 's/(id\("com.android.application"\) version )"[^"]+"/\1"8.12.1"/; s/(id\("org.jetbrains.kotlin.android"\) version )"[^"]+"/\1"2.2.0"/' android/settings.gradle.kts
          sed -Ei 's/gradle-[0-9.]+-(all|bin)\.zip/gradle-8.13-\1.zip/' android/gradle/wrapper/gradle-wrapper.properties
      - name: Build installable APK
        run: |
          set +e
          flutter build apk --debug 2>&1 | tee "$RUNNER_TEMP/apk-build.log"
          status=${PIPESTATUS[0]}
          if [[ $status != 0 ]]; then
            while IFS= read -r line; do
              line=${line//%/%25}
              echo "::error::$line"
            done < <(grep -Ei 'error:|failed|exception|requires|what went wrong' "$RUNNER_TEMP/apk-build.log" | head -30)
          fi
          exit "$status"
      - uses: actions/upload-artifact@v4
        with:
          name: DetechX-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
