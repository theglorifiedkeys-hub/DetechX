name: detechx
description: Home service diagnostics and dispatch demo.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.7.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  shared_preferences: ^2.5.3
  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/ac.jpg
    - assets/mike.jpg
  fonts:
    - family: Lucide
      fonts:
        - asset: assets/lucide.ttf
    - family: Inter
      fonts:
        - asset: assets/inter.ttf
